<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Legend Bar">
<title>Legend Bartending</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --primary: #0891b2;
  --primary-dark: #0e7490;
  --bg: #f2f2f7;
  --surface: #ffffff;
  --surface2: #f2f2f7;
  --label: #000000;
  --label2: rgba(60,60,67,0.6);
  --label3: rgba(60,60,67,0.3);
  --sep: rgba(60,60,67,0.29);
  --sep-light: rgba(60,60,67,0.12);
  --fill: rgba(120,120,128,0.2);
  --green: #34c759;
  --red: #ff3b30;
  --orange: #ff9500;
  --safe-top: env(safe-area-inset-top, 44px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --tab-h: 49px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000;
    --surface: #1c1c1e;
    --surface2: #2c2c2e;
    --label: #fff;
    --label2: rgba(235,235,245,0.6);
    --label3: rgba(235,235,245,0.3);
    --sep: rgba(84,84,88,0.65);
    --sep-light: rgba(84,84,88,0.36);
    --fill: rgba(120,120,128,0.36);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--label);-webkit-font-smoothing:antialiased;}

/* ── Login ── */
#loginScreen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;}
.login-logo{text-align:center;margin-bottom:36px;}
.login-logo-icon{font-size:56px;display:block;margin-bottom:8px;}
.login-logo-name{font-size:28px;font-weight:800;color:var(--primary);}
.login-logo-sub{font-size:15px;color:var(--label2);margin-top:4px;}
.login-form{width:100%;max-width:360px;}
.login-group{margin-bottom:12px;}
.login-label{font-size:13px;font-weight:600;color:var(--label2);margin-bottom:5px;display:block;}
.login-input{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--sep);background:var(--surface);font-size:17px;color:var(--label);font-family:inherit;outline:none;}
.login-input:focus{border-color:var(--primary);}
.login-btn{width:100%;padding:15px;border-radius:12px;background:var(--primary);color:#fff;font-size:17px;font-weight:700;border:none;cursor:pointer;margin-top:8px;}
.login-btn:active{opacity:.85;}
.login-err{color:var(--red);font-size:14px;text-align:center;min-height:18px;margin:8px 0;}

/* ── App Shell ── */
#app{display:none;flex-direction:column;height:100dvh;}
#app.show{display:flex;}
#mainContent{flex:1;overflow:hidden;position:relative;}

/* ── Header ── */
.hdr{background:var(--surface);border-bottom:.5px solid var(--sep);display:flex;align-items:flex-end;justify-content:space-between;padding:0 16px 12px;padding-top:calc(var(--safe-top) + 4px);min-height:calc(var(--safe-top) + 52px);position:relative;z-index:50;}
.hdr-title{font-size:17px;font-weight:600;position:absolute;left:50%;transform:translateX(-50%);bottom:12px;white-space:nowrap;}
.hdr-left,.hdr-right{z-index:1;display:flex;align-items:center;gap:4px;}
.hdr-btn{background:none;border:none;color:var(--primary);font-size:17px;cursor:pointer;padding:4px;line-height:1;}
.hdr-back{display:flex;align-items:center;gap:2px;color:var(--primary);font-size:17px;background:none;border:none;cursor:pointer;}

/* ── Screen stack ── */
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);padding-bottom:16px;transform:translateX(0);transition:transform .3s cubic-bezier(.4,0,.2,1);}
.screen.offright{transform:translateX(100%);}
.screen.offleft{transform:translateX(-100%);}

/* ── Tab Bar ── */
#tabBar{background:rgba(248,248,248,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--sep);display:flex;padding-bottom:var(--safe-bottom);}
@media(prefers-color-scheme:dark){#tabBar{background:rgba(28,28,30,.94);}}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 0;background:none;border:none;cursor:pointer;color:var(--label2);min-height:var(--tab-h);}
.tab-item.active{color:var(--primary);}
.tab-icon{font-size:22px;line-height:1;}
.tab-lbl{font-size:10px;font-weight:500;}
.tab-badge{position:absolute;top:-2px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:10px;}

/* ── iOS List ── */
.section{margin:20px 0 0;}
.section-hdr{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.5px;padding:0 16px 6px;}
.list{background:var(--surface);border-radius:12px;margin:0 16px;overflow:hidden;}
.cell{display:flex;align-items:center;padding:12px 16px;border-bottom:.5px solid var(--sep-light);gap:12px;cursor:pointer;background:var(--surface);min-height:52px;}
.cell:last-child{border-bottom:none;}
.cell:active{background:var(--fill);}
.cell-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.cell-body{flex:1;min-width:0;}
.cell-title{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cell-sub{font-size:13px;color:var(--label2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cell-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.cell-chevron{color:var(--label3);font-size:18px;flex-shrink:0;}

/* ── Stats Grid ── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 16px 0;}
.stat-card{background:var(--surface);border-radius:14px;padding:16px;}
.stat-val{font-size:30px;font-weight:800;color:var(--primary);}
.stat-lbl{font-size:13px;color:var(--label2);margin-top:3px;}

/* ── Status Pills ── */
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700;}
.pill-booked,.pill-confirmed{background:#e0f2fe;color:#0369a1;}
.pill-completed{background:#dcfce7;color:#15803d;}
.pill-cancelled{background:#fee2e2;color:#dc2626;}
.pill-pending{background:#fef3c7;color:#d97706;}
.pill-in-progress{background:#f3e8ff;color:#7c3aed;}
@media(prefers-color-scheme:dark){
  .pill-booked,.pill-confirmed{background:#164e63;color:#67e8f9;}
  .pill-completed{background:#14532d;color:#86efac;}
  .pill-cancelled{background:#7f1d1d;color:#fca5a5;}
  .pill-pending{background:#78350f;color:#fde68a;}
}

/* ── Segmented Control ── */
.seg-wrap{margin:12px 16px;background:var(--fill);border-radius:9px;padding:2px;display:flex;}
.seg-btn{flex:1;padding:7px 4px;font-size:13px;font-weight:500;border:none;background:none;border-radius:7px;cursor:pointer;color:var(--label);transition:all .2s;white-space:nowrap;}
.seg-btn.active{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.15);font-weight:700;color:var(--primary);}

/* ── Search ── */
.search-wrap{padding:8px 16px;}
.search-bar{display:flex;align-items:center;background:var(--fill);border-radius:10px;padding:8px 12px;gap:8px;}
.search-inp{flex:1;border:none;background:none;font-size:15px;color:var(--label);font-family:inherit;outline:none;}
.search-inp::placeholder{color:var(--label2);}

/* ── Sheet Modal ── */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;}
.sheet-bg.open{opacity:1;pointer-events:all;}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-radius:22px 22px 0 0;z-index:201;max-height:94dvh;display:flex;flex-direction:column;transform:translateY(101%);transition:transform .36s cubic-bezier(.34,1.05,.64,1);}
.sheet-bg.open .sheet{transform:translateY(0);}
.sheet-handle{width:40px;height:4px;background:var(--sep);border-radius:2px;margin:10px auto 0;flex-shrink:0;}
.sheet-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 12px;flex-shrink:0;border-bottom:.5px solid var(--sep-light);}
.sheet-title{font-size:17px;font-weight:700;}
.sheet-close{color:var(--primary);font-size:17px;background:none;border:none;cursor:pointer;padding:4px;}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding-bottom:calc(var(--safe-bottom) + 24px);}

/* ── Form ── */
.form-section{margin:16px 0 0;}
.form-section-label{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.4px;padding:0 16px 6px;}
.form-group{background:var(--surface);border-radius:12px;margin:0 16px;overflow:hidden;}
.form-row{display:flex;align-items:center;padding:12px 16px;border-bottom:.5px solid var(--sep-light);min-height:48px;gap:12px;}
.form-row:last-child{border-bottom:none;}
.form-lbl{font-size:15px;color:var(--label);min-width:110px;flex-shrink:0;}
.form-inp{flex:1;border:none;background:none;font-size:15px;color:var(--label);font-family:inherit;text-align:right;outline:none;min-width:0;}
.form-inp::placeholder{color:var(--label3);}
.form-sel{flex:1;border:none;background:none;font-size:15px;color:var(--label);font-family:inherit;text-align:right;outline:none;-webkit-appearance:none;cursor:pointer;}
.form-textarea{width:100%;border:none;background:none;font-size:15px;color:var(--label);font-family:inherit;outline:none;resize:vertical;padding:12px 16px;min-height:72px;}

/* ── Buttons ── */
.btn-wrap{padding:0 16px;margin-top:12px;display:flex;flex-direction:column;gap:10px;}
.btn{padding:15px;border-radius:13px;font-size:17px;font-weight:700;border:none;cursor:pointer;text-align:center;width:100%;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-secondary{background:var(--fill);color:var(--primary);}
.btn-destructive{background:#fee2e2;color:#dc2626;}
.btn:active{opacity:.8;}

/* ── FAB ── */
#fab{position:fixed;right:20px;bottom:calc(var(--tab-h) + var(--safe-bottom) + 16px);width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;font-size:30px;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(8,145,178,.4);display:flex;align-items:center;justify-content:center;z-index:90;transition:transform .15s;}
#fab:active{transform:scale(.93);}

/* ── Detail rows ── */
.detail-list{background:var(--surface);border-radius:12px;margin:0 16px;overflow:hidden;}
.detail-row{display:flex;align-items:flex-start;padding:12px 16px;border-bottom:.5px solid var(--sep-light);gap:8px;}
.detail-row:last-child{border-bottom:none;}
.detail-lbl{font-size:14px;color:var(--label2);min-width:110px;flex-shrink:0;padding-top:1px;}
.detail-val{font-size:15px;color:var(--label);flex:1;text-align:right;}
.detail-val a{color:var(--primary);text-decoration:none;}

/* ── Empty state ── */
.empty{text-align:center;padding:56px 24px;color:var(--label2);}
.empty-icon{font-size:52px;margin-bottom:14px;}
.empty-title{font-size:20px;font-weight:700;color:var(--label);margin-bottom:6px;}
.empty-sub{font-size:15px;}

/* ── Loading ── */
.loading{text-align:center;padding:48px;color:var(--label2);font-size:15px;}

/* ── Misc ── */
.money-positive{color:#15803d;font-weight:700;}
.money-negative{color:#dc2626;font-weight:700;}
.page-title{font-size:34px;font-weight:800;padding:8px 16px 4px;}
</style>
</head>
<body>

<!-- Login -->
<div id="loginScreen">
  <div class="login-logo">
    <span class="login-logo-icon">🍸</span>
    <div class="login-logo-name">Legend Bartending</div>
    <div class="login-logo-sub">Business Manager</div>
  </div>
  <div class="login-form">
    <div class="login-group">
      <label class="login-label">Email</label>
      <input class="login-input" id="lEmail" type="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="login-group">
      <label class="login-label">Password</label>
      <input class="login-input" id="lPass" type="password" placeholder="Password" autocomplete="current-password">
    </div>
    <div class="login-err" id="lErr"></div>
    <button class="login-btn" onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- App -->
<div id="app">
  <!-- Header -->
  <div class="hdr" id="hdr">
    <div class="hdr-left" id="hdrLeft"></div>
    <div class="hdr-title" id="hdrTitle">Legend Bartending</div>
    <div class="hdr-right" id="hdrRight"></div>
  </div>

  <!-- Content -->
  <div id="mainContent">
    <div class="screen" id="screen"></div>
  </div>

  <!-- Tab bar -->
  <div id="tabBar">
    <button class="tab-item active" data-tab="home">
      <span class="tab-icon">🏠</span>
      <span class="tab-lbl">Home</span>
    </button>
    <button class="tab-item" data-tab="events">
      <span class="tab-icon">📅</span>
      <span class="tab-lbl">Events</span>
    </button>
    <button class="tab-item" data-tab="customers">
      <span class="tab-icon">👥</span>
      <span class="tab-lbl">Customers</span>
    </button>
    <button class="tab-item" data-tab="staff">
      <span class="tab-icon">🍸</span>
      <span class="tab-lbl">Staff</span>
    </button>
    <button class="tab-item" data-tab="reports">
      <span class="tab-icon">📋</span>
      <span class="tab-lbl">Reports</span>
    </button>
  </div>
</div>

<!-- FAB -->
<button id="fab" onclick="onFab()">+</button>

<!-- Sheet -->
<div class="sheet-bg" id="sheetBg" onclick="handleSheetBgClick(event)">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-hdr">
      <div class="sheet-title" id="sheetTitle"></div>
      <button class="sheet-close" onclick="closeSheet()">Done</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script>
'use strict';
// ─── Constants ───────────────────────────────────────────
const SUPA_URL = 'https://dcydmngafvdhxxjptexh.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjeWRtbmdhZnZkaHh4anB0ZXhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0OTIxNzcsImV4cCI6MjA5NjA2ODE3N30.bqSr83R3PGNNJN0FlFTjwGJyXOFz6RMlge95HquCw3E';
const TABLE = 'bar_tracker_data';

// ─── State ───────────────────────────────────────────────
let state = { events:[], customers:[], bartenders:[], costs:[], blackoutDates:[] };
let currentUser = null;
let currentTab = 'home';
let eventsFilter = 'all';
let eventsSearch = '';
let eventsSortAsc = true;
let iosEventsViewMode = 'list'; // 'list' or 'calendar'
let iosCalCursor = (() => { const d = new Date(); d.setDate(1); return d; })();
let iosCalSelectedDate = null;
let customersSearch = '';
let staffSearch = '';
let _syncTimer = null;

// ─── Supabase ────────────────────────────────────────────
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);

// ─── Auth ────────────────────────────────────────────────
sb.auth.onAuthStateChange((event, session) => {
  currentUser = session?.user || null;
  if (currentUser) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').classList.add('show');
    document.getElementById('fab').style.display = 'flex';
    loadFromCloud().then(() => switchTab('home'));
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('app').classList.remove('show');
    document.getElementById('fab').style.display = 'none';
  }
});

async function doLogin() {
  const email = document.getElementById('lEmail').value.trim();
  const pass = document.getElementById('lPass').value;
  const err = document.getElementById('lErr');
  err.textContent = '';
  if (!email || !pass) { err.textContent = 'Enter email and password.'; return; }
  err.style.color = 'var(--label2)';
  err.textContent = 'Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { err.style.color = 'var(--red)'; err.textContent = error.message; }
}

async function doSignOut() {
  await sb.auth.signOut();
  closeSheet();
}

// ─── Cloud Sync ──────────────────────────────────────────
async function loadFromCloud() {
  if (!currentUser) return;
  const res = await sb.from(TABLE).select('data,updated_at').eq('id', currentUser.id).maybeSingle();
  if (!res.data?.data) {
    /* Cloud empty — push local up if we have anything */
    if ((state.events||[]).length > 0) {
      const now = new Date().toISOString();
      const snap = JSON.parse(JSON.stringify(state)); snap._updatedAt = now;
      await sb.from(TABLE).upsert({ id: currentUser.id, user_id: currentUser.id, data: snap, updated_at: now }, { onConflict: 'id' });
      state._updatedAt = now;
    }
    return;
  }
  const loaded = res.data.data;
  /* Timestamp-based conflict resolution */
  const cloudTs = res.data.updated_at ? new Date(res.data.updated_at).getTime() : 0;
  const localTs = state._updatedAt ? new Date(state._updatedAt).getTime() : 0;
  if (cloudTs >= localTs) {
    state = { events:[], customers:[], bartenders:[], costs:[], blackoutDates:[], ...loaded };
  } else {
    /* Local is newer — push up */
    const now = new Date().toISOString();
    const snap = JSON.parse(JSON.stringify(state)); snap._updatedAt = now;
    await sb.from(TABLE).upsert({ id: currentUser.id, user_id: currentUser.id, data: snap, updated_at: now }, { onConflict: 'id' });
    state._updatedAt = now;
  }
}

function scheduleSync() {
  state._updatedAt = new Date().toISOString(); /* Stamp local change time */
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(saveToCloud, 1500);
}

async function saveToCloud() {
  if (!currentUser) return;
  const now = new Date().toISOString();
  const snap = JSON.parse(JSON.stringify(state)); snap._updatedAt = now;
  await sb.from(TABLE).upsert({ id: currentUser.id, user_id: currentUser.id, data: snap, updated_at: now }, { onConflict: 'id' });
  state._updatedAt = now;
}

/* Lightweight background check — only downloads full data when cloud is newer */
async function checkForRemoteUpdates() {
  if (!currentUser) return;
  try {
    const res = await sb.from(TABLE).select('updated_at').eq('id', currentUser.id).maybeSingle();
    if (!res.data) return;
    const cloudTs = res.data.updated_at ? new Date(res.data.updated_at).getTime() : 0;
    const localTs = state._updatedAt ? new Date(state._updatedAt).getTime() : 0;
    if (cloudTs > localTs + 5000) {
      const full = await sb.from(TABLE).select('data,updated_at').eq('id', currentUser.id).maybeSingle();
      if (full.data?.data) {
        state = { events:[], customers:[], bartenders:[], costs:[], blackoutDates:[], ...full.data.data };
        switchTab(currentTab, true);
      }
    }
  } catch(e) {}
}

/* Poll every 2 minutes + check on tab focus */
setInterval(checkForRemoteUpdates, 2*60*1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForRemoteUpdates(); });

async function refreshData() {
  await loadFromCloud();
  switchTab(currentTab, true);
}

// ─── Helpers ─────────────────────────────────────────────
function safe(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function money(n) { return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d) { if(!d) return '—'; const p=d.split('-'); return p[1]+'/'+p[2]+'/'+p[0]; }
function fmtTime(t) { if(!t) return ''; const [hh,mm]=t.split(':'); const h=parseInt(hh,10); return (h%12||12)+':'+(mm||'00')+' '+(h>=12?'PM':'AM'); }
function fmtPhone(p) { let d=(p||'').replace(/\D/g,''); if(d.length===11&&d[0]==='1') d=d.slice(1); return d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:p||'—'; }
function generateId() { return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function customerMap() { return Object.fromEntries((state.customers||[]).map(c=>[c.id,c])); }
function bartenderMap() { return Object.fromEntries((state.bartenders||[]).map(b=>[b.id,b])); }

function pillClass(status) {
  const s=(status||'').toLowerCase().replace(/\s+/g,'-');
  if(['booked','confirmed'].includes(s)) return 'pill-booked';
  if(s==='completed') return 'pill-completed';
  if(s==='cancelled') return 'pill-cancelled';
  if(s==='pending') return 'pill-pending';
  if(s==='in-progress') return 'pill-in-progress';
  return 'pill-booked';
}

function enrichedEvents(ascending=false) {
  const cmap = customerMap();
  return (state.events||[])
    .filter(e => !e.deleted)
    .map(e => ({
      ...e,
      customerName: (cmap[e.customerId]||{}).name||'Unassigned',
      customerPhone: (cmap[e.customerId]||{}).phone||'',
    }))
    .sort((a,b) => ascending
      ? String(a.date||'').localeCompare(String(b.date||''))
      : String(b.date||'').localeCompare(String(a.date||'')));
}

// Status order for display
const STATUS_ORDER = ['booked','deciding','confirmed','pending','in-progress','completed','cancelled','lost'];

function eventStatuses() {
  const found = new Set((state.events||[]).filter(e=>!e.deleted).map(e=>(e.status||'').toLowerCase()).filter(Boolean));
  // Show in preferred order, then any others alphabetically
  const ordered = STATUS_ORDER.filter(s=>found.has(s));
  found.forEach(s=>{ if(!STATUS_ORDER.includes(s)) ordered.push(s); });
  return ordered;
}

function bartenderAssignmentCost(a, ev) {
  const rate = Number(a.rate||0);
  const travel = Number(a.travelPay||0);
  const expense = Number(a.expenseReimbursement||0);
  const tips = Number(a.tips||0);
  let labor = 0;
  if ((a.payType||'hourly')==='flat') {
    labor = rate;
  } else {
    let hrs = Number(a.actualHours||a.hours||0);
    if (!hrs && ev.startTime && ev.endTime) {
      const [sh,sm]=ev.startTime.split(':').map(Number);
      const [eh,em]=ev.endTime.split(':').map(Number);
      hrs = Math.max(0,(eh*60+em-sh*60-sm)/60);
    }
    const otHrs = Number(a.overtimeHours||0);
    const otRate = Number(a.overtimeRate||rate*1.5);
    labor = rate*Math.max(0,hrs-otHrs)+otRate*otHrs;
  }
  return labor+travel+expense+tips;
}
function eventTipTotal(ev) {
  return (ev.bartenderAssignments||[]).reduce((s,a)=>s+(Number(a.tips||0)||0),0);
}

function eventFinancials(ev) {
  const quote = parseFloat(ev.quotationAmount)||0;
  const reimb = parseFloat(ev.reimbursableExpenses)||0;
  const deposit = parseFloat(ev.depositAmountPaid)||0;
  const final = parseFloat(ev.finalAmountPaid)||0;
  const collected = deposit+final;
  const balance = Math.max(0,quote+reimb-collected);
  const staffCost = (ev.bartenderAssignments||[]).reduce((s,a)=>s+bartenderAssignmentCost(a,ev),0);
  const tips = eventTipTotal(ev);
  // Split staffCost into base labor only vs travel pay (tips are pass-through, excluded from profit)
  const baseLaborOnly = (ev.bartenderAssignments||[]).reduce((s,a) => {
    const rate = Number(a.rate||0);
    if ((a.payType||'hourly')==='flat') return s + rate;
    let hrs = Number(a.actualHours||a.hours||0);
    if (!hrs && ev.startTime && ev.endTime) {
      const [sh,sm]=ev.startTime.split(':').map(Number);
      const [eh,em]=ev.endTime.split(':').map(Number);
      hrs = Math.max(0,(eh*60+em-sh*60-sm)/60);
    }
    const otHrs = Number(a.overtimeHours||0);
    const otRate = Number(a.overtimeRate||rate*1.5);
    return s + rate*Math.max(0,hrs-otHrs)+otRate*otHrs;
  }, 0);
  const travelPay = (ev.bartenderAssignments||[]).reduce((s,a)=>s+(Number(a.travelPay||0)||0)+(Number(a.expenseReimbursement||0)||0), 0);
  const profit = collected - baseLaborOnly - travelPay;  /* tips excluded — pass-through */
  return { quote, reimb, deposit, final, collected, balance, staffCost, baseLaborOnly, travelPay, tips, profit };
}

function todayStr() { return new Date().toISOString().slice(0,10); }

// ─── Navigation ──────────────────────────────────────────
function switchTab(tab, sameTab=false) {
  currentTab = tab;
  // Update tab bar
  document.querySelectorAll('.tab-item').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  // Render content
  renderTab(tab);
  // Update header
  updateHeader(tab);
  // FAB visibility
  document.getElementById('fab').style.display = ['home','reports'].includes(tab) ? 'none' : 'flex';
}

function updateHeader(tab) {
  const titles = { home:'Legend Bartending', events:'Events', customers:'Customers', staff:'Staff', reports:'Reports' };
  document.getElementById('hdrTitle').textContent = titles[tab]||'';
  document.getElementById('hdrLeft').innerHTML = '';
  document.getElementById('hdrRight').innerHTML = tab==='home'
    ? `<button class="hdr-btn" onclick="openSettings()" title="Settings">⚙️</button>`
    : `<button class="hdr-btn" onclick="refreshData()" title="Refresh">↻</button>`;
}

function renderTab(tab) {
  const screen = document.getElementById('screen');
  switch(tab) {
    case 'home':      screen.innerHTML = getHomeHtml(); break;
    case 'events':    screen.innerHTML = getEventsHtml(); break;
    case 'customers': screen.innerHTML = getCustomersHtml(); break;
    case 'staff':     screen.innerHTML = getStaffHtml(); break;
    case 'reports':   screen.innerHTML = getReportsHtml(); break;
  }
  screen.scrollTop = 0;
}

// ─── Tab: Home ───────────────────────────────────────────
function getHomeHtml() {
  const evs = enrichedEvents(false); // descending for "recent completed"
  const evsAsc = enrichedEvents(true); // ascending for upcoming (soonest first)
  const today = todayStr();
  const upcoming = evsAsc.filter(e => (e.status||'').toLowerCase() === 'booked');
  const completed = evs.filter(e => (e.status||'').toLowerCase()==='completed');
  const thisMonth = new Date().toISOString().slice(0,7);
  const monthRevenue = evs
    .filter(e => (e.date||'').startsWith(thisMonth) && (e.status||'').toLowerCase()==='completed')
    .reduce((s,e) => s+(parseFloat(e.depositAmountPaid)||0)+(parseFloat(e.finalAmountPaid)||0), 0);
  const unpaidStaff = (state.events||[]).reduce((s,ev) => {
    if ((ev.status||'').toLowerCase()!=='completed') return s;
    return s + (ev.bartenderAssignments||[]).filter(a=>!a.paid).reduce((ss,a)=>ss+bartenderAssignmentCost(a,ev),0);
  }, 0);

  const todayEvs = evsAsc.filter(e => e.date===today && (e.status||'').toLowerCase()==='booked');
  const nextEvs = upcoming.filter(e => e.date > today).slice(0,5);

  let html = `<div class="page-title">👋 Hello, Alberto</div>`;
  html += `<div style="font-size:14px;color:var(--label2);padding:0 16px 4px;">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>`;

  // Stats
  html += `<div class="stats">
    <div class="stat-card"><div class="stat-val">${upcoming.length}</div><div class="stat-lbl">Upcoming Events</div></div>
    <div class="stat-card"><div class="stat-val">${money(monthRevenue)}</div><div class="stat-lbl">This Month</div></div>
    <div class="stat-card"><div class="stat-val">${completed.length}</div><div class="stat-lbl">Completed</div></div>
    <div class="stat-card"><div class="stat-val money-negative" style="font-size:22px;">${money(unpaidStaff)}</div><div class="stat-lbl">Unpaid Staff</div></div>
  </div>`;

  // Today's events
  if (todayEvs.length) {
    html += `<div class="section"><div class="section-hdr">Today</div><div class="list">`;
    todayEvs.forEach(e => { html += eventCell(e); });
    html += `</div></div>`;
  }

  // Upcoming
  if (nextEvs.length) {
    html += `<div class="section"><div class="section-hdr">Upcoming</div><div class="list">`;
    nextEvs.forEach(e => { html += eventCell(e); });
    html += `</div></div>`;
  }

  // Recent completed
  const recent = completed.slice(0,3);
  if (recent.length) {
    html += `<div class="section"><div class="section-hdr">Recent Completed</div><div class="list">`;
    recent.forEach(e => { html += eventCell(e); });
    html += `</div></div>`;
  }

  if (!evs.length) {
    html += `<div class="empty"><div class="empty-icon">🍸</div><div class="empty-title">No events yet</div><div class="empty-sub">Switch to Events to add your first booking.</div></div>`;
  }

  return html;
}

// ─── iOS Calendar View ───────────────────────────────────
const STATUS_COLORS = { booked:'#16a34a', completed:'#2563eb', deciding:'#d97706', lost:'#dc2626', cancelled:'#6b7280', canceled:'#6b7280', 'in-progress':'#7c3aed', confirmed:'#0891b2', pending:'#78350f' };
function iosCalMonthHtml() {
  // Apply same status filter as the chips
  let evs = enrichedEvents(true);
  if (eventsFilter !== 'all') evs = evs.filter(e => (e.status||'').toLowerCase() === eventsFilter);
  // Build date → events map
  const byDate = {};
  evs.forEach(e => { if (e.date) { (byDate[e.date] = byDate[e.date]||[]).push(e); } });

  const blackouts = new Set(state.blackoutDates || []);
  // Build date → staff-off names map
  const staffOffByDate = {};
  (state.bartenders || []).forEach(b => {
    (b.unavailableDates || []).forEach(d => {
      if (!staffOffByDate[d]) staffOffByDate[d] = [];
      staffOffByDate[d].push(b.name || 'Staff');
    });
  });

  const yr = iosCalCursor.getFullYear(), mo = iosCalCursor.getMonth();
  const monthLabel = iosCalCursor.toLocaleDateString('en-US', { month:'long', year:'numeric' });
  const today = new Date(); const todayKey = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  // Calendar grid start: Sunday of the week containing the 1st
  const first = new Date(yr, mo, 1);
  const startDay = new Date(first); startDay.setDate(1 - first.getDay());

  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let grid = `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:0 12px;">`;
  // Headers
  dayNames.forEach(d => { grid += `<div style="text-align:center;font-size:11px;font-weight:600;color:var(--label2);padding:4px 0;">${d}</div>`; });

  // 6 weeks max
  const cur = new Date(startDay);
  for (let i = 0; i < 42; i++) {
    const key = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`;
    const inMonth = cur.getMonth() === mo;
    const isToday = key === todayKey;
    const isSelected = key === iosCalSelectedDate;
    const dayEvs = byDate[key] || [];
    const isBlackout = blackouts.has(key);
    const offStaff = staffOffByDate[key] || [];
    const dateStr = JSON.stringify(key);

    let bg = isSelected ? 'var(--primary)' : isBlackout ? 'rgba(220,38,38,0.10)' : isToday ? 'rgba(var(--primary-rgb,0,122,255),0.12)' : 'var(--fill)';
    let borderColor = isSelected ? 'var(--primary)' : isBlackout ? '#fca5a5' : 'transparent';

    grid += `<div onclick="iosCalSelectedDate=${dateStr};document.getElementById('iosCalDay').innerHTML=iosCalDayEventsHtml(${dateStr});" style="
      min-height:52px;border-radius:10px;padding:4px;cursor:pointer;text-align:center;
      background:${bg};
      opacity:${inMonth?1:0.35};border:${isSelected?'2px solid var(--primary)':`2px solid ${borderColor}`};
    ">
      <div style="font-size:13px;font-weight:${isToday?700:500};color:${isSelected?'#fff':isBlackout?'#b91c1c':isToday?'var(--primary)':'var(--label)'};">${cur.getDate()}</div>
      <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:2px;">
        ${isBlackout ? `<div style="font-size:9px;color:${isSelected?'#fff':'#b91c1c'};font-weight:700;">🚫</div>` : ''}
        ${offStaff.length>0 && !isBlackout ? `<div style="font-size:9px;color:${isSelected?'#fff':'#92400e'};font-weight:700;">⚠️</div>` : ''}
        ${dayEvs.slice(0,isBlackout||offStaff.length?2:3).map(e=>`<div style="width:6px;height:6px;border-radius:50%;background:${STATUS_COLORS[(e.status||'').toLowerCase()]||'var(--primary)'};"></div>`).join('')}
        ${dayEvs.length>3?`<div style="font-size:9px;color:${isSelected?'#fff':'var(--label2)'};">+${dayEvs.length-3}</div>`:''}
      </div>
    </div>`;
    cur.setDate(cur.getDate() + 1);
    // Stop after 4 weeks if we've left the month and it's a Sunday
    if (i >= 27 && cur.getMonth() !== mo && cur.getDay() === 0) break;
  }
  grid += `</div>`;

  let html = `
    <div style="display:flex;align-items:center;padding:10px 16px 6px;gap:8px;">
      <button onclick="iosCalCursor.setMonth(iosCalCursor.getMonth()-1);renderTab('events')" style="background:var(--fill);border:none;border-radius:8px;width:32px;height:32px;font-size:18px;cursor:pointer;">‹</button>
      <div style="flex:1;text-align:center;font-weight:700;font-size:16px;">${monthLabel}</div>
      <button onclick="openBlackoutSheet()" style="background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;color:#b91c1c;cursor:pointer;">🚫 Blackouts</button>
      <button onclick="iosCalCursor.setMonth(iosCalCursor.getMonth()+1);renderTab('events')" style="background:var(--fill);border:none;border-radius:8px;width:32px;height:32px;font-size:18px;cursor:pointer;">›</button>
    </div>
    ${grid}
    <div id="iosCalDay" style="padding:8px 16px 0;">${iosCalSelectedDate?iosCalDayEventsHtml(iosCalSelectedDate):''}</div>
  `;
  return html;
}

function iosCalDayEventsHtml(dateKey) {

  if (!evs.length) return `<div><div style="font-weight:600;font-size:14px;margin-bottom:6px;color:var(--label);">${label}</div>${notices}<div style="text-align:center;color:var(--label2);padding:16px;font-size:14px;">No events on this day</div></div>`;
  return `<div><div style="font-weight:600;font-size:14px;margin-bottom:6px;color:var(--label);">${label}</div>${notices}
    <div class="list">${evs.map(e=>eventCell(e)).join('')}</div></div>`;
}

function getStaffHtml() {
  let barts = (state.bartenders||[]).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));

  let html = '';

    html += `<div class="empty"><div class="empty-icon">🍸</div><div class="empty-title">No staff</div><div class="empty-sub">Tap + to add a staff member.</div></div>`;

    barts.forEach(b => {
      const p = payouts[b.id]||{paid:0,unpaid:0};

        <span class="cell-chevron">›</span>

    </div>`;
  });
  html += `</div></div>`;
  return html;
}

// ─── Sheet Management ────────────────────────────────────
function openSheet(title, html, closeTxt='Done') {
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetBody').innerHTML = html;
  document.getElementById('sheetBody').scrollTop = 0;
  document.querySelector('.sheet-close').textContent = closeTxt;
  document.getElementById('sheetBg').classList.add('open');
}

function closeSheet() {
  document.getElementById('sheetBg').classList.remove('open');
}

function handleSheetBgClick(e) {
  if (e.target === document.getElementById('sheetBg')) closeSheet();
}

// ─── Blackout Dates (mobile) ──────────────────────────────
function openBlackoutSheet() {
  openSheet('🚫 Blackout Dates', buildBlackoutSheetHtml(), 'Done');
}
function buildBlackoutSheetHtml() {
  const dates = (state.blackoutDates||[]).slice().sort();
  const listHtml = dates.length
    ? dates.map(d => {
        const label = new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--separator);">
          <span style="font-size:14px;">📅 ${label}</span>
          <button onclick="removeBlackoutDateMobile('${d}')" style="background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:4px 10px;font-size:13px;color:#b91c1c;cursor:pointer;">Remove</button>
        </div>`;
      }).join('')
    : `<div style="text-align:center;color:var(--label2);padding:16px;font-size:14px;">No blackout dates set.</div>`;
  return `<div style="padding:4px 0 12px;">
    <p style="font-size:13px;color:var(--label2);margin-bottom:16px;">Dates when you do not want to book events. They appear highlighted in red on the calendar.</p>

      <button onclick="addBlackoutDateMobile()" style="background:var(--primary);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;">Add</button>
    </div>
    <div id="mobileBlackoutList">${listHtml}</div>
  </div>`;
}
function addBlackoutDateMobile() {
  const inp = document.getElementById('mobileBlackoutInput');
  if (!inp || !inp.value) return;
  const d = inp.value;
  if (!(state.blackoutDates||[]).includes(d)) {
    state.blackoutDates = [...(state.blackoutDates||[]), d];
    scheduleSync();
  }
  inp.value = '';
  document.getElementById('mobileBlackoutList').innerHTML = buildBlackoutSheetHtml().match(/<div id="mobileBlackoutList">([\s\S]*)<\/div>\s*<\/div>$/)?.[1] || '';
  // Refresh list inline without closing sheet
  const listEl = document.getElementById('mobileBlackoutList');
  if (listEl) {
    const dates2 = (state.blackoutDates||[]).slice().sort();
    listEl.innerHTML = dates2.length
      ? dates2.map(d2 => {
          const label = new Date(d2+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
          return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--separator);">

          </div>`;
        }).join('')
      : `<div style="text-align:center;color:var(--label2);padding:16px;font-size:14px;">No blackout dates set.</div>`;
  }
}
function removeBlackoutDateMobile(d) {
  state.blackoutDates = (state.blackoutDates||[]).filter(x=>x!==d);

  const listEl = document.getElementById('mobileBlackoutList');

// ─── Attachments (view + share, no upload) ────────────────
async function loadEventAttachments(eventId) {
  const section = document.getElementById('eventAttachSection');
  if (!section || !currentUser) return;
  const uid = currentUser.id;
  const { data, error } = await sb.storage.from('event-documents').list(`${uid}/${eventId}`, { limit: 100, sortBy:{column:'name',order:'asc'} });
  if (error || !data || !data.filter(f=>f.name).length) return;
  const files = data.filter(f => f.name);
  const paths = files.map(f => `${uid}/${eventId}/${f.name}`);
  const { data: signed } = await sb.storage.from('event-documents').createSignedUrls(paths, 3600);
  const urlMap = {};
  (signed||[]).forEach(u => { if(u.signedUrl) urlMap[u.path] = u.signedUrl; });

  function fileIcon(name) {
    const e = (name.split('.').pop()||'').toLowerCase();
    if(['jpg','jpeg','png','gif','webp','bmp'].includes(e)) return '🖼';
    if(e==='pdf') return '📄';
    if(['doc','docx'].includes(e)) return '📝';
    if(['xls','xlsx'].includes(e)) return '📊';
    if(['txt','csv'].includes(e)) return '📃';
    return '📎';
  }

  let html = `<div class="section"><div class="section-hdr">Attachments (${files.length})</div><div class="detail-list">`;
  files.forEach(f => {
    const path = `${uid}/${eventId}/${f.name}`;
    const url = urlMap[path]||'';
    const enc = encodeURIComponent(url);
    const encName = encodeURIComponent(f.name);
    html += `<div class="detail-row" style="align-items:center;gap:10px;">
      <span style="font-size:22px;flex-shrink:0;">${fileIcon(f.name)}</span>
      <span style="flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${safe(f.name)}</span>
      <div style="display:flex;gap:6px;flex-shrink:0;">
        ${url?`<button onclick="viewAttachment('${enc}','${encName}')" style="font-size:13px;padding:6px 12px;border:1.5px solid var(--primary);border-radius:9px;color:var(--primary);background:none;cursor:pointer;font-weight:600;">View</button>`:''}
        ${url?`<button onclick="shareAttachment('${enc}','${encName}')" style="font-size:13px;padding:6px 12px;border:1.5px solid var(--sep);border-radius:9px;color:var(--label);background:var(--fill);cursor:pointer;font-weight:600;">Share</button>`:''}
      </div>
    </div>`;
  });
  html += `</div></div>`;
  section.innerHTML = html;
}

function viewAttachment(enc, encName) {
  const url = decodeURIComponent(enc);
  const name = decodeURIComponent(encName);
  const ext = (name.split('.').pop()||'').toLowerCase();
  if (['doc','docx','xls','xlsx'].includes(ext)) {
    window.open('https://view.officeapps.live.com/op/view.aspx?src='+encodeURIComponent(url), '_blank');
  } else if (['txt','csv','md'].includes(ext)) {
    fetch(url).then(r=>r.text()).then(text=>showTextOverlay(name,text)).catch(()=>window.open(url,'_blank'));
  } else {
    window.open(url, '_blank');
  }
}

async function shareAttachment(enc, encName) {
  const url = decodeURIComponent(enc);
  const name = decodeURIComponent(encName);
  if (navigator.share) {
    try { await navigator.share({ title: name, url }); } catch(e) { /* user cancelled or not supported */ }
  } else {
    try { await navigator.clipboard.writeText(url); alert('Link copied — paste it into a message.'); } catch(e) {}
  }
}

function showTextOverlay(name, text) {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,44px);';
  d.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border-bottom:.5px solid var(--sep);flex-shrink:0;">
    <span style="font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80%;">${safe(name)}</span>
    <button onclick="this.closest('div[style*=fixed]').remove()" style="color:var(--primary);background:none;border:none;font-size:17px;cursor:pointer;flex-shrink:0;">Done</button>
  </div>

  const a = (ev.bartenderAssignments||[]).find(a=>a.id===bartId);

function addAssignmentToForm(eventId, currentAssignments) {
  const bartId = document.getElementById('fe_addBart').value;
  if (!bartId) { alert('Select a staff member.'); return; }
  const role = document.getElementById('fe_role').value||'Bartender';
  const payType = document.getElementById('fe_paytype').value;
  const rate = document.getElementById('fe_rate').value||0;
  // Check availability
  const eventDate = document.getElementById('fe_date')?.value || '';
  const bmap2 = bartenderMap();
  const staffB = bmap2[bartId];
  if (staffB && eventDate && (staffB.unavailableDates||[]).includes(eventDate)) {
    const go = confirm(`⚠️ ${staffB.name} has ${eventDate} marked as unavailable (day off).\n\nAdd them anyway?`);
    if (!go) return;
  }
  const newA = { id: bartId, role, payType, rate: Number(rate), paid: false };
  const updated = [...(currentAssignments||[]), newA];
  // Update the actual event in state if editing
  if (eventId) {
    const ev = (state.events||[]).find(e=>e.id===eventId);
    if (ev) ev.bartenderAssignments = updated;
  }
  // Re-open edit form
  openEditEvent(eventId||null);
}

function removeAssignment(eventId, bartId, idx) {
  if (eventId && eventId!=='new') {
    const ev = (state.events||[]).find(e=>e.id===eventId);
    if (ev) ev.bartenderAssignments = (ev.bartenderAssignments||[]).filter((_,i)=>String(i)!==String(idx));
  }
  openEditEvent(eventId&&eventId!=='new'?eventId:null);
}

function mobileRecalcQuote(eventId, startTime, endTime) {
  // Try to get times from the event form first, fall back to passed values
  const start = document.getElementById('fe_start')?.value || startTime || '';
  const end   = document.getElementById('fe_end')?.value   || endTime   || '';
  let duration = 0;
  if (start && end) {
    const [sh,sm] = start.split(':').map(Number);
    const [eh,em] = end.split(':').map(Number);
    duration = Math.max(0, (eh*60+em - sh*60-sm) / 60);
  }
  const bartCount  = Number(document.getElementById('fe_bartCount').value)  || 0;
  const bartRate   = Number(document.getElementById('fe_bartRate').value)   || 0;
  const bartSetup  = Number(document.getElementById('fe_bartSetup').value)  || 0;
  const bbCount    = Number(document.getElementById('fe_bbCount').value)    || 0;
  const bbRate     = Number(document.getElementById('fe_bbRate').value)     || 0;
  const bbSetup    = Number(document.getElementById('fe_bbSetup').value)    || 0;
  const travelFee  = Number(document.getElementById('fe_travelFee').value)  || 0;
  const depPct     = Number(document.getElementById('fe_depPct').value)     || 30;

  const lines = [];
  let total = 0;

  if (!duration) lines.push('⚠ Enter start & end time above to include event hours.');

  if (bartCount > 0 && bartRate > 0) {
    const hrs = duration + bartSetup;
    const sub = bartCount * hrs * bartRate;
    lines.push(`${bartCount} bartender${bartCount>1?'s':''} × $${bartRate}/hr × ${hrs} hrs${bartSetup>0?' ('+duration+' event + '+bartSetup+' setup)':''} = $${sub.toFixed(2)}`);
    total += sub;
  }
  if (bbCount > 0 && bbRate > 0) {
    const hrs = duration + bbSetup;
    const sub = bbCount * hrs * bbRate;
    lines.push(`${bbCount} barback${bbCount>1?'s':''} × $${bbRate}/hr × ${hrs} hrs${bbSetup>0?' ('+duration+' event + '+bbSetup+' setup)':''} = $${sub.toFixed(2)}`);
    total += sub;
  }
  if (travelFee > 0) { lines.push(`Travel fee = $${travelFee.toFixed(2)}`); total += travelFee; }

  if (total > 0) {
    lines.push(`Total = $${total.toFixed(2)}`);
    document.getElementById('fe_quote').value = total.toFixed(2);
    if (depPct > 0) {
      const dep = Math.round(total * depPct / 100 * 100) / 100;
      lines.push(`Deposit (${depPct}%) = $${dep.toFixed(2)}`);
    }
  }

  const bd = document.getElementById('fe_recalcBreakdown');
  if (bd) { bd.style.display = 'block'; bd.innerHTML = lines.map(l=>`<div>${safe(l)}</div>`).join(''); }
}

  const name = document.getElementById('fc_name').value.trim();

  const data = { id:id||generateId(), name, phone:document.getElementById('fc_phone').value, email:document.getElementById('fc_email').value, notes:document.getElementById('fc_notes').value };
  if (id) {
    const idx = (state.customers||[]).findIndex(c=>c.id===id);
    if (idx>=0) state.customers[idx]={...state.customers[idx],...data};
    else { state.customers=state.customers||[]; state.customers.push(data); }
  } else { state.customers=state.customers||[]; state.customers.push(data); }
  scheduleSync();
  closeSheet();
  renderTab(currentTab);
}

function confirmDeleteCustomer(id) {
  if (!confirm('Delete this customer?')) return;
  state.customers=(state.customers||[]).filter(c=>c.id!==id);
  scheduleSync(); closeSheet(); renderTab(currentTab);
}

// ─── Staff Detail ──────────────────────────────────────────
function openStaffDetail(id) {
  const b = (state.bartenders||[]).find(b=>b.id===id);
  if (!b) return;
  const evs = (state.events||[]).filter(e=>!e.deleted&&(e.bartenderAssignments||[]).find(a=>a.id===id))
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const cmap = customerMap();

  let paidTotal=0, unpaidTotal=0;
  evs.forEach(ev => {
    const a=(ev.bartenderAssignments||[]).find(a=>a.id===id);
    if(!a) return;
    const cost=bartenderAssignmentCost(a,ev);
    if(a.paid) paidTotal+=cost; else unpaidTotal+=cost;
  });

  let html = `<div class="section"><div class="detail-list">
    ${b.phone?`<div class="detail-row"><span class="detail-lbl">Phone</span><span class="detail-val"><a href="tel:${safe(b.phone)}">${safe(fmtPhone(b.phone))}</a></span></div>`:''}
    <div class="detail-row"><span class="detail-lbl">Paid Out</span><span class="detail-val money-positive">${money(paidTotal)}</span></div>
    <div class="detail-row"><span class="detail-lbl">Amount Owed</span><span class="detail-val ${unpaidTotal>0?'money-negative':''}">${unpaidTotal>0?money(unpaidTotal):'All paid ✓'}</span></div>
  </div></div>`;

  if (evs.length) {
    html += `<div class="section"><div class="section-hdr">Assigned Events</div><div class="list" style="margin:0 16px;">`;
    evs.forEach(ev => {
      const a=(ev.bartenderAssignments||[]).find(a=>a.id===id)||{};
      const cost=bartenderAssignmentCost(a,ev);
      const cust=cmap[ev.customerId]||{};
      html += `<div class="cell" onclick="openEventDetail('${safe(ev.id)}')">
        <div class="cell-body">
          <div class="cell-title">${safe(ev.eventName||'Event')}</div>
          <div class="cell-sub">${fmtDate(ev.date)} · ${safe(cust.name||'')} · <span class="${pillClass(ev.status)}" style="font-size:11px;">${safe(ev.status||'')}</span></div>
        </div>
        <div class="cell-right" style="font-size:13px;text-align:right;">
          <span style="font-weight:700;">${money(cost)}</span>
          <span style="${a.paid?'color:#15803d':'color:#dc2626'};font-size:12px;">${a.paid?'Paid':'Unpaid'}</span>
        </div>
        <span class="cell-chevron">›</span>
      </div>`;
    });
    html += `</div></div>`;
  }

  // Days Off section
  const today2 = new Date().toISOString().slice(0,10);
  const upcoming = (b.unavailableDates||[]).filter(d=>d>=today2).sort();
  html += `<div class="section"><div class="section-hdr">Days Off / Unavailability</div>
    <div class="detail-list">
      <div class="detail-row"><span class="detail-lbl">Upcoming</span><span class="detail-val">${upcoming.length>0?upcoming.length+' date'+(upcoming.length!==1?'s':''):'None scheduled'}</span></div>
      ${upcoming.slice(0,5).map(d=>`<div class="detail-row"><span class="detail-lbl"></span><span class="detail-val" style="color:#92400e;font-weight:600;">🔴 ${fmtDate(d)}</span></div>`).join('')}
    </div>
    <div style="padding:8px 16px 12px;">
      <button class="btn btn-secondary" style="width:100%;" onclick="openManageDaysOff('${safe(id)}')">📅 Manage Days Off</button>
    </div>
  </div>`;

  html += `<div class="btn-wrap">
    <button class="btn btn-primary" onclick="openEditStaff('${safe(id)}')">✏️ Edit Staff Member</button>
    <button class="btn btn-destructive" onclick="confirmDeleteStaff('${safe(id)}')">🗑 Delete</button>
  </div>`;

  openSheet(safe(b.name), html, '✕');
}

function openManageDaysOff(id) {
  const b = (state.bartenders||[]).find(b=>b.id===id);
  if (!b) return;
  let workingDates = [...(b.unavailableDates||[])];
  const today = new Date().toISOString().slice(0,10);

  function renderDaysOffHtml() {
    const sorted = [...workingDates].sort();
    const upcoming = sorted.filter(d=>d>=today);
    const past = sorted.filter(d=>d<today);
    let chips = upcoming.map(d=>`
      <div class="detail-row" style="padding:10px 0;">
        <span class="detail-val" style="color:#92400e;font-weight:600;">🔴 ${fmtDate(d)}</span>
        <button onclick="removeMobileDayOff('${d}')" style="background:none;border:1px solid #dc2626;border-radius:6px;color:#dc2626;padding:4px 10px;font-size:12px;cursor:pointer;">Remove</button>
      </div>`).join('');
    if (!upcoming.length) chips = '<div class="detail-row"><span class="detail-val" style="color:var(--label2);">No upcoming days off</span></div>';
    return `
      <div class="form-section"><div class="form-section-label">Add Date Off</div>
        <div class="form-group">
          <div class="form-row" style="border-bottom:none;flex-direction:column;gap:8px;">
            <input class="form-inp" id="mob_daysoff_date" type="date" value="${today}" style="width:100%;">
            <button onclick="addMobileDayOff()" style="width:100%;padding:13px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;">+ Add This Date</button>
          </div>
        </div>
      </div>
      <div class="form-section"><div class="form-section-label">Upcoming Days Off</div>
        <div class="form-group">${chips}</div>
      </div>
      ${past.length?`<div class="form-section"><div class="form-section-label" style="color:var(--label2);">Past Dates (${past.length})</div>
        <div class="form-group">${past.slice(-5).reverse().map(d=>`<div class="detail-row"><span class="detail-val" style="color:var(--label2);">${fmtDate(d)}</span><button onclick="removeMobileDayOff('${d}')" style="background:none;border:1px solid var(--separator);border-radius:6px;color:var(--label2);padding:4px 10px;font-size:12px;cursor:pointer;">Remove</button></div>`).join('')}
        </div>
      </div>`:''}
      <div class="btn-wrap">
        <button class="btn btn-primary" onclick="saveDaysOff('${safe(id)}')">💾 Save Days Off</button>
        <button class="btn btn-secondary" onclick="openStaffDetail('${safe(id)}')">← Back</button>
      </div>`;
  }

  window._editingDaysOff = workingDates;
  window.addMobileDayOff = function() {
    const d = document.getElementById('mob_daysoff_date')?.value;
    if (!d || window._editingDaysOff.includes(d)) return;
    window._editingDaysOff.push(d);
    document.getElementById('sheetBody').innerHTML = renderDaysOffHtml();
  };
  window.removeMobileDayOff = function(d) {
    window._editingDaysOff = window._editingDaysOff.filter(x=>x!==d);
    document.getElementById('sheetBody').innerHTML = renderDaysOffHtml();
  };
  window.saveDaysOff = function(bid) {
    const bart = (state.bartenders||[]).find(b=>b.id===bid);
    if (bart) { bart.unavailableDates = [...window._editingDaysOff]; scheduleSync(); }
    openStaffDetail(bid);
  };

  openSheet(`📅 Days Off — ${safe(b.name)}`, renderDaysOffHtml(), '✕');
}

function openAddStaff() { openEditStaff(null); }

function openEditStaff(id) {
  const b = id ? (state.bartenders||[]).find(b=>b.id===id)||{} : {};
  const html = `
    <div class="form-section"><div class="form-group">
      <div class="form-row"><label class="form-lbl">Name</label><input class="form-inp" id="fb_name" placeholder="Full name" value="${safe(b.name||'')}"></div>
      <div class="form-row"><label class="form-lbl">Phone</label><input class="form-inp" id="fb_phone" type="tel" placeholder="Phone" value="${safe(b.phone||'')}"></div>
      <div class="form-row"><label class="form-lbl">Notes</label><input class="form-inp" id="fb_notes" placeholder="Notes" value="${safe(b.notes||'')}"></div>
    </div></div>
    <div class="btn-wrap">
      <button class="btn btn-primary" onclick="saveStaffForm('${safe(id||'')}')">💾 Save</button>
      <button class="btn btn-secondary" onclick="closeSheet()">Cancel</button>
    </div>`;
  openSheet(id ? '✏️ Edit Staff' : '+ New Staff Member', html, '✕');
}

function saveStaffForm(id) {
  const name = document.getElementById('fb_name').value.trim();
  if (!name) { alert('Name is required.'); return; }
  const existing = id ? (state.bartenders||[]).find(b=>b.id===id) : null;
  const data = { id:id||generateId(), name, phone:document.getElementById('fb_phone').value, notes:document.getElementById('fb_notes').value, unavailableDates: existing?.unavailableDates||[] };
  if (id) {
    const idx=(state.bartenders||[]).findIndex(b=>b.id===id);
    if(idx>=0) state.bartenders[idx]={...state.bartenders[idx],...data};
    else { state.bartenders=state.bartenders||[]; state.bartenders.push(data); }
  } else { state.bartenders=state.bartenders||[]; state.bartenders.push(data); }
  scheduleSync(); closeSheet(); renderTab(currentTab);
}

function confirmDeleteStaff(id) {
  if (!confirm('Delete this staff member?')) return;
  state.bartenders=(state.bartenders||[]).filter(b=>b.id!==id);
  scheduleSync(); closeSheet(); renderTab(currentTab);
}

// ─── Reports ─────────────────────────────────────────────
function openReport(id) {
  let title='', html='';

  if (id==='staffAvailability') {
    title = '🗓 Staff Availability';
    const today = new Date().toISOString().slice(0,10);

    function renderAvailMobile(date) {
      const barts = (state.bartenders||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
      if (!barts.length) return `<div class="empty"><div class="empty-icon">👥</div><div class="empty-title">No staff added yet</div></div>`;
      const eventsOnDate = (state.events||[]).filter(e=>!e.deleted&&e.date===date&&['booked','deciding','completed'].includes((e.status||'').toLowerCase()));
      const assignedIds = new Set(eventsOnDate.flatMap(ev=>(ev.bartenderAssignments||[]).map(a=>a.id)));
      const unavail = barts.filter(b=>(b.unavailableDates||[]).includes(date));
      const avail = barts.filter(b=>!(b.unavailableDates||[]).includes(date));
      let html = '';
      if (eventsOnDate.length) {
        html += `<div style="margin:0 16px 8px;padding:10px 12px;background:#dbeafe;border-radius:8px;font-size:13px;color:#1e3a8a;">
          <strong>${eventsOnDate.length} event${eventsOnDate.length!==1?'s':''} on this date:</strong> ${eventsOnDate.map(e=>safe(e.eventName||'Event')).join(', ')}
        </div>`;
      }
      html += `<div style="margin:0 16px 4px;display:flex;gap:16px;font-size:13px;font-weight:600;">
        <span style="color:#dc2626;">🔴 ${unavail.length} unavailable</span>
        <span style="color:#16a34a;">✅ ${avail.length} available</span>
      </div>`;
      html += `<div class="list" style="margin:8px 16px;">`;
      const allSorted = [...unavail.map(b=>({b,isAvail:false})),...avail.map(b=>({b,isAvail:true}))];
      allSorted.forEach(({b,isAvail})=>{
        const assigned = assignedIds.has(b.id);
        const upcomingOff = (b.unavailableDates||[]).filter(d=>d>date).sort().slice(0,3);
        html += `<div class="cell" onclick="closeSheet();setTimeout(()=>openStaffDetail('${safe(b.id)}'),200)">
          <div class="cell-icon" style="background:${isAvail?'#dcfce7':'#fee2e2'};font-size:18px;">${isAvail?'✅':'🔴'}</div>
          <div class="cell-body">
            <div class="cell-title">${safe(b.name||'')}${assigned?'<span style="margin-left:6px;font-size:11px;background:#dbeafe;color:#1d4ed8;padding:1px 6px;border-radius:8px;">Assigned</span>':''}</div>
            <div class="cell-sub">${isAvail?'Available':`Day off${upcomingOff.length?' · Next off: '+upcomingOff.map(fmtDate).join(', '):''}` }</div>
          </div>
          <span class="cell-chevron">›</span>
        </div>`;
      });
      html += `</div>`;
      return html;
    }

    html = `<div style="padding:12px 16px 8px;">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--label2);">Check availability for date:</div>
      <input id="mob_availDate" type="date" value="${today}" style="width:100%;padding:12px;border:1px solid var(--separator);border-radius:10px;font-size:16px;background:var(--surface);color:var(--label);font-family:inherit;box-sizing:border-box;">
    </div>
    <div id="mob_availResults">${renderAvailMobile(today)}</div>`;

    setTimeout(() => {
      const inp = document.getElementById('mob_availDate');
      if (!inp) return;
      inp.addEventListener('change', () => {
        const res = document.getElementById('mob_availResults');
        if (res) res.innerHTML = renderAvailMobile(inp.value||today);
      });
    }, 50);
  }

  else if (id==='eventSchedule') {
    title = '📅 Events Schedule';
    const ALL_STATUSES = ['deciding','booked','completed','lost','canceled'];
    const STATUS_LABELS = {deciding:'Deciding',booked:'Booked',completed:'Completed',lost:'Lost',canceled:'Canceled'};
    const STATUS_COLORS = {deciding:'#d97706',booked:'#2563eb',completed:'#16a34a',lost:'#6b7280',canceled:'#9ca3af'};
    const cmap = customerMap();

    function getEvSched(sel) {
      const selSet = new Set(sel);
      return (state.events||[]).filter(e => !e.deleted && selSet.has((e.status||'deciding').toLowerCase()))
        .sort((a,b) => {
          const da=a.date||'9999-99-99', db=b.date||'9999-99-99';
          if(da<db) return -1; if(da>db) return 1;
          return (a.startTime||'')<(b.startTime||'')?-1:1;
        });
    }

    function getStaffingLabel(ev) {
      const a = ev.bartenderAssignments||[];
      if (a.length > 0) {
        const barts = a.filter(x=>(x.role||'Bartender').toLowerCase()==='bartender').length;
        const backs = a.filter(x=>(x.role||'').toLowerCase()==='barback').length;
        const parts = [];
        if(barts) parts.push(barts+'B');
        if(backs) parts.push(backs+'BB');
        if(a.length-barts-backs>0) parts.push((a.length-barts-backs)+' other');
        return parts.join(' · ')||a.length+' assigned';
      }
      const qb=parseInt(ev.quotedBartenderCount||0)||0, qbb=parseInt(ev.quotedBarbackCount||0)||0;
      if(qb||qbb) return (qb?qb+'B ':''+(qbb?qbb+'BB':'')).trim()+' (quoted)';
      return '—';
    }

    function getCityStateMobile(addr) {
      if (!addr) return '';
      const parts = addr.split(',').map(p=>p.trim()).filter(Boolean);
      for (let i=parts.length-1;i>=1;i--) {
        const m = parts[i].match(/^([A-Za-z]{2})\b/);
        if (m) return parts[i-1]+', '+m[1].toUpperCase();
      }
      return '';
    }

    function renderEvSchedRows(evs) {
      if (!evs.length) return `<div class="empty" style="padding:32px 0;"><div class="empty-icon">🗓</div><div class="empty-title">No events</div><div class="empty-sub">No events match the selected filters.</div></div>`;
      return evs.map(ev => {
        const cust = (cmap[ev.customerId]||{}).name||'';
        const status = (ev.status||'deciding').toLowerCase();
        const dot = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${STATUS_COLORS[status]||'#999'};margin-right:5px;flex-shrink:0;"></span>`;
        const staff = getStaffingLabel(ev);
        const cityState = getCityStateMobile(ev.venueAddress);
        return `<div class="cell" onclick="closeSheet();setTimeout(()=>openEventDetail('${safe(ev.id)}'),200)">
          <div class="cell-body">
            <div class="cell-title">${safe(ev.eventName||'Untitled')}</div>
            <div class="cell-sub">${fmtDate(ev.date)}${ev.startTime?' · '+fmtTime(ev.startTime):''}${cust?' · '+safe(cust):''}</div>
            <div class="cell-sub" style="margin-top:2px;">${dot}${STATUS_LABELS[status]||ev.status} · 👥 ${staff}${cityState?' · 📍'+safe(cityState):''}</div>
          </div>
          <span class="cell-chevron">›</span>
        </div>`;
      }).join('');
    }

    const cbHtml = ALL_STATUSES.map(s =>
      `<label style="display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:6px 10px;background:var(--fill);border-radius:8px;cursor:pointer;">
        <input type="checkbox" class="evSched-cb" value="${s}" checked style="width:15px;height:15px;">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${STATUS_COLORS[s]};flex-shrink:0;"></span>
        ${STATUS_LABELS[s]}</label>`
    ).join('');

    const initEvs = getEvSched(ALL_STATUSES);
    html = `<div style="padding:12px 16px 0;">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--label2);">Filter by status:</div>
      <div id="evSchedFilters" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">${cbHtml}</div>
    </div>
    <div id="evSchedList" class="list" style="margin:0 16px;">${renderEvSchedRows(initEvs)}</div>`;

    setTimeout(() => {
      const filters = document.getElementById('evSchedFilters');
      if (!filters) return;
      filters.addEventListener('change', () => {
        const sel = [...filters.querySelectorAll('.evSched-cb:checked')].map(c=>c.value);
        const list = document.getElementById('evSchedList');
        if (list) list.innerHTML = renderEvSchedRows(getEvSched(sel));
      });
    }, 50);
  }

  else if (id==='balanceDue') {
    title = '💰 Balance Still Due';
    const evs = enrichedEvents().filter(e => {
      const s=(e.status||'').toLowerCase();
      const q=parseFloat(e.quotationAmount)||0;
      const paid=(parseFloat(e.depositAmountPaid)||0)+(parseFloat(e.finalAmountPaid)||0);
      return s==='completed' && Math.max(0,q-paid)>0;
    });
    if (!evs.length) {
      html = `<div class="empty"><div class="empty-icon">🎉</div><div class="empty-title">All collected!</div><div class="empty-sub">No completed events with outstanding balance.</div></div>`;
    } else {
      let total=0;
      html = `<div class="list" style="margin:16px;">`;
      evs.forEach(e => {
        const q=parseFloat(e.quotationAmount)||0;
        const paid=(parseFloat(e.depositAmountPaid)||0)+(parseFloat(e.finalAmountPaid)||0);
        const bal=Math.max(0,q-paid);
        total+=bal;
        html += `<div class="cell" onclick="closeSheet();setTimeout(()=>openEventDetail('${safe(e.id)}'),200)">
          <div class="cell-body">
            <div class="cell-title">${safe(e.eventName||'')}</div>
            <div class="cell-sub">${safe(e.customerName)} · ${fmtDate(e.date)}</div>
          </div>
          <div class="cell-right"><span class="money-negative" style="font-size:15px;font-weight:700;">${money(bal)}</span></div>
          <span class="cell-chevron">›</span>
        </div>`;
      });
      html += `</div><div style="padding:12px 20px;font-weight:700;font-size:15px;color:#dc2626;">Total outstanding: ${money(total)}</div>`;
    }
  }

  else if (id==='unpaidStaff') {
    title = '👤 Unpaid Staff';
    const bmap = bartenderMap();
    const rows = [];
    (state.events||[]).filter(e=>!e.deleted&&(e.status||'').toLowerCase()==='completed').forEach(ev => {
      (ev.bartenderAssignments||[]).filter(a=>!a.paid).forEach(a => {
        const cost=bartenderAssignmentCost(a,ev);
        if(cost>0) rows.push({ staffName:(bmap[a.id]||{}).name||'Unknown', staffPhone:(bmap[a.id]||{}).phone||'', evName:ev.eventName||'', evDate:ev.date||'', role:a.role||'Bartender', cost, evId:ev.id });
      });
    });
    if (!rows.length) {
      html = `<div class="empty"><div class="empty-icon">✅</div><div class="empty-title">All paid!</div><div class="empty-sub">No unpaid staff on completed events.</div></div>`;
    } else {
      let total=0;
      html = `<div class="list" style="margin:16px;">`;
      rows.forEach(r => {
        total+=r.cost;
        html += `<div class="cell" onclick="closeSheet();setTimeout(()=>openEventDetail('${safe(r.evId)}'),200)">
          <div class="cell-body">
            <div class="cell-title">${safe(r.staffName)}</div>
            <div class="cell-sub">${safe(r.evName)} · ${fmtDate(r.evDate)}</div>
          </div>
          <div class="cell-right"><span class="money-negative" style="font-weight:700;">${money(r.cost)}</span></div>
          <span class="cell-chevron">›</span>
        </div>`;
      });
      html += `</div><div style="padding:12px 20px;font-weight:700;font-size:15px;color:#dc2626;">Total owed: ${money(total)}</div>`;
    }
  }

  else if (id==='staffEvents') {
    title = '📋 Staff Events';
    const bmap = bartenderMap();
    const cmap = customerMap();
    const rows = [];
    (state.bartenders||[]).forEach(b => {
      (state.events||[]).filter(e=>!e.deleted).forEach(ev => {
        const s=(ev.status||'').toLowerCase();
        if(s!=='completed'&&s!=='booked'&&s!=='deciding') return;
        const a=(ev.bartenderAssignments||[]).find(a=>a.id===b.id);
        if(!a) return;
        rows.push({ name:b.name||'', evName:ev.eventName||'', date:ev.date||'', start:ev.startTime||'', end:ev.endTime||'', status:ev.status||'', cost:bartenderAssignmentCost(a,ev), paid:a.paid, evId:ev.id, role:a.role||'Bartender', laborPay:0, travelPay:Number(a.travelPay||0), expense:Number(a.expenseReimbursement||0), tips:Number(a.tips||0) });
      });
    });
    rows.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    if (!rows.length) {
      html = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">No assignments</div></div>`;
    } else {
      html = `<div class="list" style="margin:16px;">`;
      rows.forEach(r => {
        html += `<div class="cell" onclick="closeSheet();setTimeout(()=>openEventDetail('${safe(r.evId)}'),200)">
          <div class="cell-body">
            <div class="cell-title">${safe(r.name)}</div>
            <div class="cell-sub">${safe(r.evName)} · ${fmtDate(r.date)}${r.start?' · '+safe(r.start):''}</div>
          </div>
          <div class="cell-right" style="font-size:13px;text-align:right;">
            <span style="font-weight:700;">${money(r.cost)}</span>
            <span style="${r.paid?'color:#15803d':'color:#dc2626'};font-size:12px;">${r.paid?'Paid':'Unpaid'}</span>
          </div>
          <span class="cell-chevron">›</span>
        </div>`;
      });
      html += `</div>`;
    }
  }

  else if (id==='eventPriceCalc') {
    title = '🧮 Event Price Calculator';
    const inp = 'width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:15px;background:var(--surface);color:var(--fg);box-sizing:border-box;';
    const lbl = 'font-size:13px;font-weight:600;display:block;margin-bottom:5px;color:var(--ink2);';
    html = `
      <div style="padding:20px 16px;">
        <div style="margin-bottom:14px;"><label style="${lbl}">Number of guests</label>
          <input type="number" id="epcGuests" min="1" max="600" placeholder="e.g. 85" style="${inp}">
        </div>
        <div style="margin-bottom:14px;"><label style="${lbl}">Duration (hours)</label>
          <input type="number" id="epcHours" min="1" max="12" step="0.5" placeholder="e.g. 5" style="${inp}">
        </div>
        <div style="margin-bottom:14px;"><label style="${lbl}">Event zip code</label>
          <input type="text" id="epcZip" maxlength="5" placeholder="e.g. 60601" style="${inp}">
        </div>
        <div style="margin-bottom:14px;"><label style="${lbl}">Client first name</label>
          <input type="text" id="epcName" placeholder="e.g. Sarah" style="${inp}">
        </div>
        <div style="margin-bottom:20px;"><label style="${lbl}">Event type</label>
          <input type="text" id="epcEventType" placeholder="e.g. wedding reception" style="${inp}">
        </div>
        <button class="btn btn-primary" style="width:100%;font-size:15px;" onclick="epcCalcMobile()">Calculate Price</button>
        <div id="epcMobileResult" style="margin-top:16px;"></div>
      </div>`;
  }

  openSheet(title, html, '✕');
}

function epcCalcMobile() {
  const guests    = parseInt((document.getElementById('epcGuests')?.value||'0'), 10);
  const hours     = parseFloat((document.getElementById('epcHours')?.value||'0'));
  const zip       = (document.getElementById('epcZip')?.value||'').trim();
  const firstName = (document.getElementById('epcName')?.value||'').trim();
  const eventType = (document.getElementById('epcEventType')?.value||'').trim();
  const resultEl  = document.getElementById('epcMobileResult');
  if (!resultEl) return;

  if (!guests || !hours || zip.length < 5) {
    resultEl.innerHTML = '<div style="color:#dc2626;font-size:14px;padding:8px 0;">Please fill in guests, hours, and zip code.</div>';
    return;
  }
  resultEl.innerHTML = '<div style="font-size:14px;color:var(--ink3);padding:8px 0;">Calculating…</div>';

  function epcStaff(g) {
    if (g<=50)  return {b:1,h:0};
    if (g<=75)  return {b:1,h:1};
    if (g<=100) return {b:2,h:0};
    if (g<=150) return {b:2,h:1};
    if (g<=200) return {b:3,h:0};
    if (g<=300) return {b:3,h:1};
    if (g<=400) return {b:4,h:0};
    return {b:4,h:1};
  }
  function epcRates(hr) {
    if (hr<=3) return {br:80,hr:40};
    if (hr<=4) return {br:75,hr:38};
    if (hr<=5) return {br:70,hr:35};
    return {br:65,hr:33};
  }
  function epcHav(lat1,lon1,lat2,lon2) {
    const R=3958.8, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
    const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }

  const billingHours = hours + 1; // +1 hr for 30min setup + 30min cleanup
  const staff = epcStaff(guests);
  const rates = epcRates(billingHours);
  const base  = (staff.b*rates.br*billingHours) + (staff.h*rates.hr*billingHours);
  const BLAT=41.7163, BLON=-88.2219;

  fetch('https://api.zippopotam.us/us/'+zip)
    .then(r => { if (!r.ok) throw new Error('ZIP "'+zip+'" not found.'); return r.json(); })
    .then(data => {
      const eLat    = parseFloat(data.places[0].latitude);
      const eLon    = parseFloat(data.places[0].longitude);
      const driveMi = Math.round(epcHav(BLAT,BLON,eLat,eLon)*1.25);
      const travel  = Math.round(driveMi*2*0.55*(staff.b+staff.h));
      const total   = Math.round(base+travel);
      const city    = (data.places[0]['place name']||zip)+', '+(data.places[0]['state abbreviation']||'');

      let staffDisp = staff.b+' state licensed bartender'+(staff.b!==1?'s':'');
      if (staff.h>0) staffDisp += ' & '+staff.h+' helper'+(staff.h!==1?'s':'');
      let staffMsg = staff.b+' state licensed bartender'+(staff.b!==1?'s':'');
      if (staff.h>0) staffMsg += ' and '+staff.h+' helper'+(staff.h!==1?'s':'');

      const fn = firstName, et = eventType || 'your event';
      const msg = (fn ? 'Hi '+fn+', thanks' : 'Thanks')+' for reaching out. We are available for your '+et+'.\n\n'
        +'We charge a flat hourly rate and don\'t have any add ons, "package" upcharges, limitations or additional fees. We do it all for our flat hourly rate.\n\n'
        +'The rate for your '+hours+' hour event will be $'+total+'. That includes '+staffMsg+', garnishes, cocktail napkins and straws, homemade syrups, liquor liability insurance, portable bar (if required), menu development, shopping list, shopping support, and travel.\n\n'
        +'Please do let us know if you have any questions. Thank you, -Alberto';

      const row = (l,v) => `<tr><td style="padding:6px 0;color:var(--ink3);font-size:14px;">${l}</td><td style="text-align:right;font-weight:600;font-size:14px;">${v}</td></tr>`;
      resultEl.innerHTML = `
        <div style="border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--surface2);margin-bottom:12px;">
          <div style="font-size:15px;font-weight:700;margin-bottom:12px;">Price Breakdown</div>
          <table style="width:100%;border-collapse:collapse;">
            ${row('Guests', guests)}
            ${row('Duration', hours+' hrs')}
            ${row('Staffing', staffDisp)}
            ${row('Rate', '$'+rates.br+'/hr bartender'+(staff.h>0?', $'+rates.hr+'/hr helper':''))}
            ${row('Base service', '$'+Math.round(base))}
            ${row('Venue', safe(city))}
            ${row('Travel (~'+driveMi+' mi, '+(staff.b+staff.h)+' staff)', '$'+travel)}
            <tr style="border-top:2px solid var(--border);">
              <td style="padding:12px 0 4px;font-size:17px;font-weight:700;">Total</td>
              <td style="text-align:right;font-size:17px;font-weight:700;color:#16a34a;padding-top:12px;">$${total}</td>
            </tr>
          </table>
        </div>
        <div style="border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--surface2);">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <div style="font-size:15px;font-weight:700;">Message</div>
            <button id="epcMobCopyBtn" style="font-size:13px;padding:5px 14px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);">Copy</button>
          </div>
          <textarea id="epcMobMsg" readonly style="width:100%;height:180px;font-size:14px;line-height:1.6;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);resize:vertical;box-sizing:border-box;font-family:inherit;"></textarea>
        </div>`;

      setTimeout(() => {
        const ta = document.getElementById('epcMobMsg');
        if (ta) ta.value = msg;
        const cb = document.getElementById('epcMobCopyBtn');
        if (cb) cb.addEventListener('click', () => {
          const text = ta ? ta.value : msg;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => {
              cb.textContent = '✓ Copied!'; setTimeout(() => { cb.textContent = 'Copy'; }, 1800);
            });
          } else {
            if (ta) { ta.select(); document.execCommand('copy'); }
            cb.textContent = '✓ Copied!'; setTimeout(() => { cb.textContent = 'Copy'; }, 1800);
          }
        });
      }, 0);
    })
    .catch(err => {
      resultEl.innerHTML = '<div style="color:#dc2626;font-size:14px;padding:8px 0;">Error: '+String(err.message||err)+'</div>';
    });
}
